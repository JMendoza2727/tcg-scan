<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#071126">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PokEX">
  <meta name="pokex-build" content="3416">
  <link rel="manifest" href="./manifest.webmanifest?v=3416">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css?v=3416">
  <title>PokEX 3.4</title>
  <link rel="stylesheet" href="./pokedex-v1.css?v=3416">
  <link rel="stylesheet" href="./scanner-v11.css?v=3416">
  <link rel="stylesheet" href="./pokex-bg.css?v=3416">
  <link rel="stylesheet" href="./pokex-v22.css?v=3416">
  <link rel="stylesheet" href="./pokex-auth-v23.css?v=3416">
  <link rel="stylesheet" href="./pokex-mobile-v231.css?v=3416">
  <link rel="stylesheet" href="./pokex-final-v24.css?v=3416">
  <link rel="stylesheet" href="./pokex-polish-v321.css?v=3416">
  <link rel="stylesheet" href="./pokex-friends-v33.css?v=3416">
  <link rel="stylesheet" href="./pokex-account-polish-v33.css?v=3416">
  <link rel="stylesheet" href="./pokex-ui-fix-v33.css?v=3416">
  <link rel="stylesheet" href="./pokex-social-v34.css?v=3416">
  <style>
    .f33-launch-copy small[data-subtitle]{font-size:0!important}.f33-launch-copy small[data-subtitle]::after{content:"Conecta con otros entrenadores";font-size:11px}
    .pokex-search-compact{display:grid!important;grid-template-columns:86px minmax(0,1fr) 108px!important;gap:10px!important;align-items:stretch}
    .pokex-search-compact #lang{width:86px!important;min-width:86px!important;min-height:52px!important;margin:0!important;padding-left:14px!important;font-size:22px!important;border-radius:15px!important}
    .pokex-search-compact #query,.pokex-search-compact #searchBtn{margin:0!important}
    @media(max-width:390px){.pokex-search-compact{grid-template-columns:82px minmax(0,1fr) 94px!important;gap:8px!important}.pokex-search-compact #lang{width:82px!important;min-width:82px!important;font-size:21px!important}}
  </style>
</head>
<body>
  <header class="top"><div class="pokex-brand"><div class="pokex-brand-mark" aria-hidden="true" hidden>⚡</div><div><h1>PokEX <span class="pokex-version">v3.4</span></h1><p>Tu colección Pokémon, siempre contigo</p></div></div><span id="netBadge" class="badge" hidden><i></i> Online</span></header>
  <main class="wrap">
    <section class="panel"><label class="label" for="query">Busca una carta</label><div class="searchRow pokex-search-compact"><select id="lang" aria-label="Idioma de la carta"><option value="es" selected>🇪🇸</option><option value="en">🇬🇧</option><option value="ja">🇯🇵</option></select><input id="query" type="search" autocomplete="off" placeholder="Buscar" disabled><button id="searchBtn" disabled>Buscar</button></div><p id="catalogStatus" class="muted">El catálogo se descargará una vez y quedará guardado en el iPhone.</p><div id="pokexScanInsideSearch"><div class="pokex-or"><span></span><b>o escanea con la cámara</b><span></span></div><button id="visualScanBtn" type="button">⚡ Escanear carta</button></div></section>
    <section class="panel hidden"><div class="label">3. O haz una foto</div><label id="cameraBtn" class="camera disabled"><span>📷 Escanear carta</span><input id="photo" type="file" accept="image/*" capture="environment" disabled></label><p class="muted">El OCR se ejecuta en el iPhone. La primera vez puede tardar mientras descarga el modelo del idioma.</p><img id="preview" class="preview hidden" alt="Foto de la carta"></section>
    <section id="progressBox" class="panel hidden" aria-live="polite"><div class="progressHead"><strong id="progressText">Preparando…</strong><span id="progressPct">0%</span></div><div class="bar"><div id="barFill"></div></div></section>
    <section id="message" class="message hidden" aria-live="polite"></section><section id="resultBox" class="hidden"></section>
    <section id="listBox" class="hidden"><div class="listHead"><strong id="countText"></strong><button id="moreBtn" class="secondary hidden">Cargar más</button></div><div id="cards" class="cards"></div></section>
  </main>
  <script src="./jp-extra-v21.js?v=3416"></script><script src="./en-images-v21.js?v=3416"></script><script src="./pokex-image-resolver-v241.js?v=3416"></script><script src="./pokex-price-resolver-v30.js?v=3416"></script><script src="./app.js?v=3416"></script><script src="./pokedex-v1.js?v=3416"></script><script src="./pokex-scanner-quality-v34.js?v=3416"></script><script src="./scanner-v11.js?v=3416"></script><script src="./pokex-clean-v1.js?v=3416"></script><script src="./pokex-language-v1.js?v=3416"></script><script src="./pokex-bg.js?v=3416"></script><script src="./pokex-v22.js?v=3416"></script><script src="./pokex-shell-v34.js?v=3416"></script><script src="./pokex-release-v34.js?v=3416"></script><script src="./pokex-firebase-config.js?v=3416"></script><script type="module" src="./pokex-auth-v23.js?v=3416"></script><script type="module" src="./pokex-mobile-v231.js?v=3416"></script><script type="module" src="./pokex-friends-v33.js?v=3416"></script><script type="module" src="./pokex-friends-fix-v33.js?v=3416"></script><script src="./pokex-account-polish-v33.js?v=3416"></script><script type="module" src="./pokex-account-core-v33.js?v=3416"></script><script type="module" src="./pokex-social-v34.js?v=3416"></script><script src="./pokex-card-language-v34.js?v=3416"></script>
  <script>(()=>{const query=document.getElementById("query"),lang=document.getElementById("lang");const forceSearchPlaceholder=()=>{if(query)query.placeholder="Buscar"};forceSearchPlaceholder();lang?.addEventListener("change",forceSearchPlaceholder)})();</script>
</body>
</html>
