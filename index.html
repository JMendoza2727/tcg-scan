<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#071126">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PokEX">
  <link rel="manifest" href="./manifest.webmanifest?v=3317">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css?v=3317">
  <title>PokEX 3.3</title>

  <link rel="stylesheet" href="./pokedex-v1.css?v=3317">
  <link rel="stylesheet" href="./scanner-v11.css?v=3317">
  <link rel="stylesheet" href="./pokex-bg.css?v=3317">
  <link rel="stylesheet" href="./pokex-v22.css?v=3317">
  <link rel="stylesheet" href="./pokex-auth-v23.css?v=3317">
  <link rel="stylesheet" href="./pokex-mobile-v231.css?v=3317">
  <link rel="stylesheet" href="./pokex-final-v24.css?v=3317">
  <link rel="stylesheet" href="./pokex-polish-v321.css?v=3317">
  <link rel="stylesheet" href="./pokex-friends-v33.css?v=3317">
  <style>
    .f33-launch-copy small[data-subtitle] { font-size: 0 !important; }
    .f33-launch-copy small[data-subtitle]::after {
      content: "Conecta con otros entrenadores";
      font-size: 11px;
    }

    .pokex-search-compact {
      display: grid !important;
      grid-template-columns: 76px minmax(0, 1fr) 108px !important;
      gap: 0 10px !important;
      align-items: stretch;
    }

    .pokex-lang-picker {
      position: relative;
      display: grid;
      min-width: 76px;
      min-height: 52px;
      place-items: center;
      overflow: hidden;
      border: 1px solid rgba(166, 191, 239, .17);
      border-right: 0;
      border-radius: 15px 0 0 15px;
      background: #08152d;
    }

    .pokex-lang-display {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 100%;
      padding-left: 4px;
      pointer-events: none;
    }

    .pokex-lang-flag {
      display: block;
      font-size: 22px;
      line-height: 1;
    }

    .pokex-lang-chevron {
      color: #f7f9ff;
      font-size: 16px;
      font-weight: 900;
      line-height: 1;
    }

    .pokex-lang-picker #lang {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      min-width: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      opacity: 0 !important;
      cursor: pointer;
    }

    .pokex-search-compact #query {
      margin-left: -10px;
      padding-left: 15px;
      border-radius: 0 15px 15px 0 !important;
    }

    @media (max-width: 390px) {
      .pokex-search-compact {
        grid-template-columns: 72px minmax(0, 1fr) 94px !important;
      }
      .pokex-lang-picker {
        min-width: 72px;
      }
      .pokex-lang-flag {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>
  <header class="top">
    <div class="pokex-brand">
      <div class="pokex-brand-mark" aria-hidden="true" hidden>⚡</div>
      <div>
        <h1>PokEX <span class="pokex-version">v3.3</span></h1>
        <p>Tu colección Pokémon, siempre contigo</p>
      </div>
    </div>
    <span id="netBadge" class="badge" hidden><i></i> Online</span>
  </header>

  <main class="wrap">
    <section class="panel">
      <label class="label" for="query">Busca una carta</label>
      <div class="searchRow pokex-search-compact">
        <div class="pokex-lang-picker">
          <div class="pokex-lang-display" aria-hidden="true">
            <span class="pokex-lang-flag" id="pokexLangFlag">🇪🇸</span>
            <span class="pokex-lang-chevron">⌄</span>
          </div>
          <select id="lang" aria-label="Idioma de la carta">
            <option value="es" selected>🇪🇸</option>
            <option value="en">🇬🇧</option>
            <option value="ja">🇯🇵</option>
          </select>
        </div>
        <input id="query" type="search" autocomplete="off" placeholder="Buscar" disabled>
        <button id="searchBtn" disabled>Buscar</button>
      </div>
      <p id="catalogStatus" class="muted pokex-catalog-compact">El catálogo se descargará una vez y quedará guardado en el iPhone.</p>
      <div id="pokexScanInsideSearch">
        <div class="pokex-or">
          <span></span>
          <b>o escanea con la cámara</b>
          <span></span>
        </div>
        <button id="visualScanBtn" type="button">⚡ Escanear carta</button>
      </div>
    </section>

    <section class="panel hidden">
      <div class="label">3. O haz una foto</div>
      <label id="cameraBtn" class="camera disabled">
        <span>📷 Escanear carta</span>
        <input id="photo" type="file" accept="image/*" capture="environment" disabled>
      </label>
      <p class="muted">El OCR se ejecuta en el iPhone. La primera vez puede tardar mientras descarga el modelo del idioma.</p>
      <img id="preview" class="preview hidden" alt="Foto de la carta">
    </section>

    <section id="progressBox" class="panel hidden" aria-live="polite">
      <div class="progressHead">
        <strong id="progressText">Preparando…</strong>
        <span id="progressPct">0%</span>
      </div>
      <div class="bar"><div id="barFill"></div></div>
    </section>

    <section id="message" class="message hidden" aria-live="polite"></section>
    <section id="resultBox" class="hidden"></section>

    <section id="listBox" class="hidden">
      <div class="listHead">
        <strong id="countText"></strong>
        <button id="moreBtn" class="secondary hidden">Cargar más</button>
      </div>
      <div id="cards" class="cards"></div>
    </section>
  </main>

  <script src="./jp-extra-v21.js?v=3317"></script>
  <script src="./en-images-v21.js?v=3317"></script>
  <script src="./pokex-image-resolver-v241.js?v=3317"></script>
  <script src="./pokex-price-resolver-v30.js?v=3317"></script>
  <script src="./app.js?v=3317"></script>
  <script src="./pokedex-v1.js?v=3317"></script>
  <script src="./scanner-v11.js?v=3317"></script>
  <script src="./pokex-clean-v1.js?v=3317"></script>
  <script src="./pokex-language-v1.js?v=3317"></script>
  <script src="./pokex-bg.js?v=3317"></script>
  <script src="./pokex-v22.js?v=3317"></script>
  <script src="./pokex-firebase-config.js?v=3317"></script>
  <script type="module" src="./pokex-auth-v23.js?v=3317"></script>
  <script type="module" src="./pokex-mobile-v231.js?v=3317"></script>
  <script type="module" src="./pokex-friends-v33.js?v=3317"></script>
  <script>
    (() => {
      const query = document.getElementById("query");
      const lang = document.getElementById("lang");
      const flag = document.getElementById("pokexLangFlag");
      const languageFlags = { es: "🇪🇸", en: "🇬🇧", ja: "🇯🇵" };
      const forceSearchPlaceholder = () => { if (query) query.placeholder = "Buscar"; };
      const refreshFlag = () => { if (flag && lang) flag.textContent = languageFlags[lang.value] || "🌐"; };
      forceSearchPlaceholder();
      refreshFlag();
      lang?.addEventListener("change", () => {
        forceSearchPlaceholder();
        refreshFlag();
      });

      const applyReleaseNotes = () => {
        const box = document.querySelector(".v23-changes");
        const welcome = document.querySelector(".v23-welcome h2");
        if (welcome) welcome.textContent = "PokEX Beta v3.3";
        if (!box || box.dataset.v33Notes === "1") return;
        box.dataset.v33Notes = "1";
        box.innerHTML = `
          <strong>Novedades principales</strong>
          <p>
            ✨ Nueva interfaz más rápida y optimizada para iPhone<br>
            🔎 Búsqueda y escáner mejorados con catálogos ES · EN · JP<br>
            🖼️ Imágenes y precios mejorados sin alterar los datos originales<br>
            🗂️ Mi Pokédex con sincronización automática<br>
            👥 Cuentas, personalización y nuevo sistema de Amigos
          </p>`;
      };

      applyReleaseNotes();
      const notesObserver = new MutationObserver(applyReleaseNotes);
      notesObserver.observe(document.body, { childList: true, subtree: true });
    })();
  </script>
</body>
</html>
