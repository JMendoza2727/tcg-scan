<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PokEX">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>PokEX</title>


<link rel="stylesheet" href="./pokedex-v1.css?v=1">

<link rel="stylesheet"
      href="./scanner-v11.css?v=11">
<link rel="stylesheet" href="./pokex-layout-v1.css?v=1">
  <link rel="stylesheet" href="./pokex-bg.css?v=20">
<link rel="stylesheet" href="./pokex-v22.css?v=224">
  <link rel="stylesheet" href="./pokex-auth-v23.css?v=2331">
  <link rel="stylesheet" href="./pokex-mobile-v231.css?v=2330">
</head>


<body>
  <header class="top">
    <div>
      <h1>⚡ PokEX Beta <span class="pokex-version">v2.3.3</span></h1>
      <p>Pokémon TCG · buscador · cámara · precios</p>
    </div>
    <span id="netBadge" class="badge">Online</span>
  </header>

  <main class="wrap">
    <section class="panel">
      <label class="label" for="lang">1. Idioma de la carta</label>
      <select id="lang">
  <option value="es" selected>🇪🇸 Español</option>
  <option value="en">🇬🇧 English</option>
  <option value="ja">🇯🇵 日本語</option>
</select>
      <p id="catalogStatus" class="muted">El catálogo se descargará una vez y quedará guardado en el iPhone.</p>
    </section>

    <section class="panel">
      <label class="label" for="query">2. Buscar</label>
      <div class="searchRow">
        <input id="query" type="search" autocomplete="off" placeholder="Primero elige idioma" disabled>
        <button id="searchBtn" disabled>Buscar</button>
      </div>
      <p class="muted"></p>
    </section>

    <section class="panel hidden">
      <div class="label">3. O haz una foto</div>
      <label id="cameraBtn" class="camera disabled">
        <span>📷 Escanear carta</span>
        <input id="photo" type="file" accept="image/*" capture="environment" disabled>
      </label>
      <p class="muted">El OCR se ejecuta en el iPhone. La primera vez puede tardar mientras descarga el modelo del idioma.</p>
      <img id="preview" class="preview hidden" alt="Foto de la carta">
    </section>

    
<section class="panel">
  <div class="label">3. 📷 Escanear carta</div>

  <button id="visualScanBtn" type="button">
    ⚡ Escanear carta
  </button>

  <div id="visualScanner" class="hidden" style="margin-top:14px">
    <iframe
      id="scannerFrame"
      allow="camera"
      style="
        width:100%;
        height:650px;
        border:0;
        border-radius:18px;
        background:#000;
      ">
    </iframe>

    <button
      id="closeScannerBtn"
      type="button"
      class="secondary"
      style="width:100%;margin-top:10px">
      Cerrar cámara
    </button>
  </div>
</section>

<section id="progressBox" class="panel hidden" aria-live="polite">
      <div class="progressHead">
        <strong id="progressText">Preparando…</strong>
        <span id="progressPct">0%</span>
      </div>
      <div class="bar"><div id="barFill"></div></div>
    </section>

    <section id="message" class="message hidden" aria-live="polite"></section>

    <section id="resultBox" class="hidden"></section>

    <section id="listBox" class="hidden">
      <div class="listHead">
        <strong id="countText"></strong>
        <button id="moreBtn" class="secondary hidden">Cargar más</button>
      </div>
      <div id="cards" class="cards"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="./jp-extra-v21.js?v=211"></script>
<script src="./en-images-v21.js?v=212"></script>
<script src="./app.js"></script>


<script src="./pokedex-v1.js?v=1"></script>

<script src="./scanner-v11.js?v=12"></script>
<script src="./pokex-clean-v1.js?v=226"></script>
<script src="./pokex-language-v1.js?v=1"></script>
<script src="./pokex-layout-v1.js?v=1"></script>
  <script src="./pokex-bg.js?v=1"></script>

<script src="./pokex-v22.js?v=225"></script>
<script src="./pokex-cloud-config.js?v=224"></script>
<script src="./pokex-cloud-v22.js?v=224"></script>

  <script src="./pokex-firebase-config.js?v=232"></script>
  <script type="module" src="./pokex-auth-v23.js?v=2331"></script>
<script type="module" src="./pokex-mobile-v231.js?v=2330"></script>
</body>


</html>
